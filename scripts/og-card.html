<!doctype html>
<!-- Source for /og.png (1200×630 social card). Regenerate with:
     chromium-browser --headless --disable-gpu --window-size=1200,630 \
       --screenshot=og.png --hide-scrollbars "file://$PWD/scripts/og-card.html" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f2f4f1;
    color: #1b231e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  .card {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
  }
  .brand {
    font-size: 92px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; line-height: 1;
  }
  .brand span { color: #0f7d5c; }
  .season {
    margin-top: 22px;
    font-size: 34px; color: #4d5a52; font-weight: 500;
  }
  .tag {
    margin-top: 14px;
    font-size: 27px; color: #7f8b83;
  }
  /* the fair-odds 1X2 bar — the site's signature motif */
  .bar {
    margin-top: 56px;
    display: flex; gap: 4px; height: 46px; width: 100%;
    border-radius: 8px; overflow: hidden;
  }
  .bar div {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 24px; letter-spacing: .06em;
  }
  .bar .h { flex: 46; background: #0f7d5c; }
  .bar .d { flex: 27; background: #97a09c; }
  .bar .a { flex: 27; background: #b45309; }
  .footer {
    height: 76px; background: #ffffff; border-top: 2px solid #dfe5df;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 96px;
    font-size: 24px; color: #7f8b83;
  }
  .footer b { color: #4d5a52; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Touch<span>line</span></div>
    <div class="season">Premier League &middot; 2026-27</div>
    <div class="tag">Fixtures &middot; scores &middot; the table &middot; fair 1X2 odds</div>
    <div class="bar">
      <div class="h">1 &nbsp;46%</div>
      <div class="d">X &nbsp;27%</div>
      <div class="a">2 &nbsp;27%</div>
    </div>
  </div>
  <div class="footer">
    <span><b>No ads, no trackers</b> &mdash; open data files</span>
    <span>melvincarvalho.github.io/touchline</span>
  </div>
</body>
</html>
